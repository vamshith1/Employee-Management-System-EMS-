# Local MySQL for the "mysql" profile:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    environment:
      MYSQL_DATABASE: ems
      MYSQL_USER: ems
      MYSQL_PASSWORD: ems
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ems-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uems", "-pems"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ems-mysql-data:
