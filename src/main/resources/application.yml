spring:
  application:
    name: employee-management-system
  profiles:
    # "dev" = in-memory H2 (no setup needed). Use "mysql" for a real MySQL database.
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). Override with JWT_SECRET in any real deployment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1lbXBsb3llZS1tYW5hZ2VtZW50LXN5c3RlbS0yMDI2}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  attendance:
    # Check-ins after this time are marked LATE
    late-after: "09:30"
  seed:
    enabled: ${SEED_DATA:true}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:ems;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ems?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:ems}
    password: ${DB_PASSWORD:ems}
  jpa:
    hibernate:
      ddl-auto: update
